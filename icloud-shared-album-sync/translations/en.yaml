configuration:
  albums:
    name: Photo albums
    description: Add, remove, or temporarily disable albums. Only the public iCloud link is required; folder names are created automatically when left blank and are always converted to lowercase dashboard-safe names.
    fields:
      name:
        name: Display name
        description: The friendly name shown on dashboards, such as Family Photos or Dee.
      shared_url:
        name: Public iCloud link
        description: In Apple Photos, enable Public Website for the Shared Album and paste its full link here.
      album_subfolder:
        name: Folder name (optional)
        description: Keep this stable if a dashboard already uses the album. Leave blank to create one from the display name. Any value is automatically converted to lowercase words joined with hyphens, for example “Dee Visits” becomes “dee-visits”.
      enabled:
        name: Sync this album
        description: Turn this off to pause an album without deleting its setup.
  interval_minutes:
    name: Check for new photos every
    description: Time in minutes between checks. 180 means every three hours; use 0 for a one-time sync.
  mirror_missing:
    name: Remove photos deleted from iCloud
    description: Keep the Home Assistant copy matched to the public album. Unrelated files and album indexes are always protected.
  advanced:
    name: Advanced settings
    description: The recommended defaults work for most homes. Open this only for retention, quality, network, or troubleshooting changes.
    fields:
      timeout:
        name: Request timeout
        description: Seconds to wait for Apple or a media download before treating it as failed.
      keep_days:
        name: Delete photos older than
        description: Age in days. Use 0 to keep photos regardless of age.
      max_files:
        name: Maximum items per album
        description: Maximum photos and videos retained in each album. Use 0 for unlimited.
      minimum_file_size_kb:
        name: Minimum file size
        description: Skip unusually small image derivatives below this size in kilobytes.
      minimum_long_edge:
        name: Minimum photo resolution
        description: Skip photo derivatives whose longest edge is below this pixel count.
      catalog_filename:
        name: Dashboard catalog filename
        description: File used by dashboards to discover all synced albums. Usually leave this as albums.json.
      debug:
        name: Detailed troubleshooting log
        description: Record extra selection and download details. Leave off unless diagnosing a problem.
