name: iCloud Shared Album Sync
slug: icloud-shared-album-sync
description: Sync public iCloud Shared Albums into safe, indexed Home Assistant media libraries.
version: "1.2.2"
url: https://github.com/BZPJoe/icloud-shared-album-sync-repo
arch:
  - aarch64
  - amd64
init: false
startup: services
map:
  - type: homeassistant_config
    read_only: false
    path: /config
  - type: share
    read_only: false
  - type: media
    read_only: false
options:
  albums:
    - name: Family Photos
      shared_url: "https://photos.icloud.com/shared/album/YOUR_PUBLIC_ALBUM_ID"
      album_subfolder: family
      enabled: true
  interval_minutes: 180
  mirror_missing: true
  advanced:
    timeout: 40
    keep_days: 0
    max_files: 500
    minimum_file_size_kb: 100
    minimum_long_edge: 1280
    catalog_filename: albums.json
    debug: false
schema:
  albums:
    - name: str
      shared_url: url
      album_subfolder: str?
      enabled: bool?
  interval_minutes: int
  mirror_missing: bool
  advanced:
    timeout: int
    keep_days: int
    max_files: int
    minimum_file_size_kb: int
    minimum_long_edge: int
    catalog_filename: str
    debug: bool
