name: Validate app

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests PyYAML
      - run: python -m unittest discover -s icloud-shared-album-sync/tests -v
      - run: python -m py_compile icloud-shared-album-sync/sync.py
